[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-battery-trading-backtest"
version = "0.1.0"
description = "A simple NEM price analysis and battery trading backtest using public AEMO data."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
